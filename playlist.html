<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Video Playlist Wallpaper</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}html,body{height:100%}
  body{background:#000;overflow:hidden;font-family:'SF Pro Display',Helvetica,Arial,sans-serif}
  .bg{position:fixed;inset:0}.bg video{width:100%;height:100%;object-fit:cover;display:block;background:#000}
  .bg video.fit-contain{object-fit:contain}.bg video.fit-stretch{object-fit:fill}
  .top-right{position:fixed;top:36px;right:42px;z-index:5;color:#fff;
    text-shadow:0 2px 16px rgba(0,0,0,.55);pointer-events:none;text-align:right}
  .time{font-size:62px;font-weight:400;line-height:1;font-variant-numeric:tabular-nums}
  .date-bottom{position:fixed;left:42px;bottom:36px;z-index:5;color:#fff;
    text-shadow:0 2px 16px rgba(0,0,0,.55);pointer-events:none;font-size:21px}
</style>
</head>
<body>
<div class="bg"><video id="v" data-playlist autoplay muted playsinline preload="auto"></video></div>
<div class="top-right"><div class="time" id="t">—</div></div>
<div class="date-bottom" id="d">—</div>
<script>
// Playlist wallpaper. data-playlist tells the Swift loop-enforcer to leave
// this video alone; advancing is managed here.
var queue = [], idx = 0, passDone = false;
var LOOP = true, started = false;
function txt(name, def){
  return fetch(name).then(function(r){
    if (!r.ok) throw 0; return r.text();
  }).then(function(s){ return s.trim(); }).catch(function(){ return def; });
}
function fitClass(m){ return m === 'contain' ? 'fit-contain' : (m === 'stretch' ? 'fit-stretch' : ''); }
function playCurrent(){
  var v = document.getElementById('v');
  if (!queue.length) return;
  v.classList.remove('fit-contain', 'fit-stretch');
  var fc = fitClass(window.__fit || 'cover');
  if (fc) v.classList.add(fc);
  v.loop = false; v.removeAttribute('loop');
  v.src = 'file://' + queue[idx % queue.length];
  v.muted = (window.__muted !== '0');
  if (!v.muted){ v.volume = 1; }
  var p = v.play(); if (p && p.catch) p.catch(function(){});
  started = true;
}
function advance(){
  if (!LOOP && idx + 1 >= queue.length){ passDone = true; return; } // play once, hold last frame
  idx = (idx + 1) % queue.length;
  playCurrent();
}
document.getElementById('v').addEventListener('ended', advance);
Promise.all([txt('videos.txt',''), txt('video_loop.txt','1'),
             txt('video_muted.txt','1'), txt('video_fit.txt','cover')])
.then(function(r){
  queue = r[0].split('\n').map(function(s){ return s.trim(); })
    .filter(function(s){ return s.length && s[0] !== '#'; });
  LOOP = (r[1] !== '0');
  window.__muted = r[2]; window.__fit = r[3];
  playCurrent();
});
// supervisor: keep our own loop flag off (Swift sets it once at load),
// recover stalls. Never touches other videos (there are none here).
setInterval(function(){
  try{
    var v = document.getElementById('v');
    if (v.loop){ v.loop = false; v.removeAttribute('loop'); }
    if (started && !passDone && v.paused && !v.ended && v.src){
      var p = v.play(); if (p && p.catch) p.catch(function(){});
    }
  }catch(e){}
}, 500);
// clock (same look/classes as wrapper so Hide toggles keep working)
function tick(){
  var d = new Date(), pad = function(n){ return String(n).padStart(2,'0'); };
  var days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  var months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  var h12 = d.getHours() % 12 || 12;
  document.getElementById('t').textContent = h12 + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
  document.getElementById('d').textContent = days[d.getDay()] + ', ' + months[d.getMonth()] + ' ' + d.getDate();
}
tick(); setInterval(tick, 1000);
</script>
</body>
</html>
