<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Momo — Settings</title>
<style>
  :root {
    --teal:  #0A7C6E;
    --amber: #F59E0B;
    --orange:#FF6B35;
    --paper: #FAFAFA;
    --ink:   #14201E;
    --mute:  rgba(20,32,30,.44);
    --line:  rgba(20,32,30,.10);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--teal);
    font: 400 13px/1.5 -apple-system, "SF Pro Text", system-ui, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    display: flex; align-items: center; justify-content: center;
    padding: 28px;
  }

  .card {
    width: 100%;
    max-width: 420px;
    background: var(--paper);
    border-radius: 18px;
    box-shadow: 0 18px 50px rgba(0,0,0,.28);
    overflow: hidden;
  }

  header {
    display: flex; align-items: center; gap: 12px;
    padding: 22px 24px 18px;
    border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
  header p  { font-size: 11px; color: var(--mute); margin-top: 1px; }

  section { padding: 18px 24px; border-bottom: 1px solid var(--line); }
  section:last-of-type { border-bottom: none; }

  h2 {
    font-size: 10px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase;
    color: var(--mute); margin-bottom: 12px;
  }

  .field { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
  .field:last-child { margin-bottom: 0; }
  .field label { font-size: 12px; color: var(--mute); }

  input, select {
    font: inherit; color: var(--ink);
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 8px 10px;
    width: 108px;
    text-align: right;
    font-variant-numeric: tabular-nums;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  input:focus, select:focus {
    border-color: var(--teal);
    box-shadow: 0 0 0 3px rgba(10,124,110,.12);
  }
  select { width: 96px; text-align: left; }

  .rows { display: flex; flex-direction: column; gap: 8px; }
  .row { display: grid; grid-template-columns: 1fr 116px; gap: 10px; align-items: center; }
  .row input.sym { text-align: left; text-transform: uppercase; letter-spacing: .04em; font-weight: 500; width: 100%; }

  .add {
    margin-top: 10px;
    background: transparent; border: 1px dashed rgba(10,124,110,.35);
    color: var(--teal); border-radius: 9px; padding: 8px 12px;
    font: inherit; font-size: 12px; cursor: pointer; width: 100%;
    transition: background .15s;
  }
  .add:hover { background: rgba(10,124,110,.06); }

  footer { padding: 16px 24px 20px; display: flex; align-items: center; gap: 10px; }
  .status { flex: 1; font-size: 11px; color: var(--mute); }
  .status.ok { color: var(--teal); }
  .status.err { color: var(--orange); }

  button.primary {
    background: var(--orange); color: var(--paper);
    border: none; border-radius: 10px; padding: 9px 18px;
    font: inherit; font-weight: 600; cursor: pointer;
    transition: transform .12s, filter .15s;
  }
  button.primary:hover { filter: brightness(1.05); }
  button.primary:active { transform: scale(.98); }

  button.ghost {
    background: transparent; color: var(--mute);
    border: 1px solid var(--line); border-radius: 10px;
    padding: 9px 14px; font: inherit; cursor: pointer;
  }
  button.ghost:hover { color: var(--ink); }

  .dot { display: inline-block; width: 6px; height: 6px; border-radius: 3px; background: var(--amber); margin-right: 6px; vertical-align: 1px; }
</style>
</head>
<body>
<div class="card">
  <header>
    <div>
      <h1>Momo</h1>
      <p>Your portfolio on the desktop</p>
    </div>
  </header>

  <section>
    <h2>Holdings</h2>
    <div class="rows" id="rows"></div>
    <button class="add" id="add">+ Add token</button>
  </section>

  <section>
    <h2>Display</h2>
    <div class="field">
      <label>Currency</label>
      <select id="currency">
        <option>USD</option><option>EUR</option><option>GBP</option><option>INR</option>
      </select>
    </div>
    <div class="field">
      <label>Refresh (seconds)</label>
      <input id="refresh" type="number" min="15" step="15" value="60">
    </div>
  </section>

  <footer>
    <div class="status" id="status"><span class="dot"></span>reads 1 credit per refresh</div>
    <button class="ghost" id="cancel">Close</button>
    <button class="primary" id="save">Save</button>
  </footer>
</div>

<script>
// Settings card. Swift hands us the current config at document start and
// receives the saved one as a message — the page never touches the disk.
const MAX_ROWS = 10;
const rowsEl = document.getElementById('rows');
const statusEl = document.getElementById('status');

const state = window.__MOMO_SETTINGS || {
  holdings: [{ symbol: 'BTC', amount: 0.12 }],
  currency: 'USD',
  refreshSeconds: 60,
};

document.getElementById('currency').value = state.currency || 'USD';
document.getElementById('refresh').value = state.refreshSeconds || 60;

function addRow(symbol = '', amount = '') {
  if (rowsEl.children.length >= MAX_ROWS) return;
  const row = document.createElement('div');
  row.className = 'row';
  row.innerHTML = `
    <input class="sym" maxlength="12" placeholder="SYMBOL" value="${symbol}">
    <input class="amt" type="number" step="any" min="0" placeholder="amount" value="${amount}">
  `;
  rowsEl.appendChild(row);
}

(state.holdings || []).forEach(h => addRow(h.symbol, h.amount));
if (!rowsEl.children.length) addRow();

document.getElementById('add').addEventListener('click', () => {
  addRow();
  const inputs = rowsEl.querySelectorAll('.sym');
  inputs[inputs.length - 1].focus();
});

document.getElementById('cancel').addEventListener('click', () => {
  if (window.webkit?.messageHandlers?.momoClose) {
    window.webkit.messageHandlers.momoClose.postMessage('close');
  } else {
    window.close();
  }
});

document.getElementById('save').addEventListener('click', () => {
  const holdings = [];
  rowsEl.querySelectorAll('.row').forEach(row => {
    const symbol = row.querySelector('.sym').value.trim().toUpperCase();
    const amount = parseFloat(row.querySelector('.amt').value);
    if (symbol && amount > 0) holdings.push({ symbol, amount });
  });

  if (!holdings.length) {
    statusEl.className = 'status err';
    statusEl.textContent = 'add at least one holding';
    return;
  }

  const payload = {
    holdings,
    currency: document.getElementById('currency').value,
    refreshSeconds: Math.max(15, parseInt(document.getElementById('refresh').value, 10) || 60),
  };

  if (window.webkit?.messageHandlers?.momoSave) {
    window.webkit.messageHandlers.momoSave.postMessage(JSON.stringify(payload));
    statusEl.className = 'status ok';
    statusEl.textContent = 'saved — wallpaper refreshing';
  } else {
    statusEl.className = 'status ok';
    statusEl.textContent = 'saved (preview only)';
    console.log('momo payload', payload);
  }
});
</script>
</body>
</html>
