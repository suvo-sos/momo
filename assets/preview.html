<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Momo — logo</title>
<style>
  body { margin: 0; padding: 48px; background: #f4f4f4; font: 12px -apple-system, system-ui, sans-serif; color: #555; }
  .row { display: flex; align-items: flex-end; gap: 32px; margin-bottom: 48px; flex-wrap: wrap; }
  .item { text-align: center; }
  .item img { display: block; margin: 0 auto 10px; }
  .dark { background: #111; padding: 32px; border-radius: 12px; }
</style>
</head>
<body>
<div class="row">
  <div class="item"><img src="logo.svg" width="512"><span>512</span></div>
  <div class="item"><img src="logo.svg" width="128"><span>128</span></div>
  <div class="item"><img src="logo.svg" width="64"><span>64</span></div>
  <div class="item"><img src="logo.svg" width="32"><span>32</span></div>
  <div class="item"><img src="logo.svg" width="16"><span>16</span></div>
</div>
<div class="row dark">
  <div class="item"><img src="logo.svg" width="128"><span style="color:#888">on dark</span></div>
</div>
</body>
</html>
