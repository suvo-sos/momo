<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Momo</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }

  :root {
    --bg: #0d0f11;
    --fg: #ffffff;
    --fg-strong: rgba(255,255,255,.94);
    --fg-dim: rgba(255,255,255,.45);
    --fg-mute: rgba(255,255,255,.48);
    --hair: rgba(255,255,255,.09);
    --hair-soft: rgba(255,255,255,.05);
    --foot: rgba(255,255,255,.24);
    --up: #6fd39a;
    --down: #e8735f;
  }
  :root[data-theme*="slate"] {
    --bg: #12171c;
    --fg: #eaf0f5;
    --fg-strong: #f4f8fb;
    --fg-dim: rgba(234,240,245,.45);
    --fg-mute: rgba(234,240,245,.52);
    --hair: rgba(234,240,245,.11);
    --hair-soft: rgba(234,240,245,.06);
    --foot: rgba(234,240,245,.28);
    --up: #5fd3a6;
    --down: #ff8f7a;
  }
  :root[data-theme*="paper"] {
    --bg: #f4f1ea;
    --fg: #1c1b18;
    --fg-strong: #14130f;
    --fg-dim: rgba(28,27,24,.48);
    --fg-mute: rgba(28,27,24,.54);
    --hair: rgba(0,0,0,.12);
    --hair-soft: rgba(0,0,0,.07);
    --foot: rgba(28,27,24,.36);
    --up: #1f7a4d;
    --down: #b0432f;
  }
  :root[data-theme*="ember"] {
    --bg: #140d0a;
    --fg: #ffe9dc;
    --fg-strong: #ffd9c4;
    --fg-dim: rgba(255,233,220,.46);
    --fg-mute: rgba(255,233,220,.54);
    --hair: rgba(255,233,220,.13);
    --hair-soft: rgba(255,233,220,.07);
    --foot: rgba(255,233,220,.3);
    --up: #f5b23c;
    --down: #ff7a5c;
  }

  body {
    background: var(--bg);
    font: 400 13px/1 -apple-system, "SF Pro Text", system-ui, sans-serif;
    color: var(--fg);
    -webkit-font-smoothing: antialiased;
  }

  /* Single full-screen container for the active WebGL background */
  #bg-layer {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    background: var(--bg);
  }
  #bg-layer .bg-media {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* Module content (the dashboard) for the Bento dashboard content style. */
  #content {
    position: fixed;
    inset: 0;
    z-index: 1;
    display: none;
    overflow: hidden;
    background: #000;
    padding: 24px 24px 24px 24px;
    scrollbar-width: thin;
    scrollbar-color: rgba(255,255,255,.18) transparent;
  }
  #content::-webkit-scrollbar { width: 6px; }
  #content::-webkit-scrollbar-track { background: transparent; }
  #content::-webkit-scrollbar-thumb { background: rgba(255,255,255,.18); border-radius: 3px; }
  #content.on { display: block; }
  #content.clear { background: transparent; }
  #content.clear .fpb .fpb-c {
    background: transparent;
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
    border: none;
  }

  /* Elegant contents: Focus, Ledger, Scale. Transparent so the background shows through. */
  #focus, #ledger, #scale {
    position: fixed;
    inset: 0;
    z-index: 1;
    display: none;
    pointer-events: none;
  }
  #focus.on, #ledger.on, #scale.on { display: block; }

  /* Minimal wallpaper panel */
  .panel {
    position: fixed;
    left: 64px;
    top: 56px;
    z-index: 2;
    pointer-events: none;
    text-align: left;
  }
  .total .value {
    font-size: 72px;
    font-weight: 700;
    letter-spacing: -0.04em;
    font-variant-numeric: tabular-nums;
    line-height: 0.95;
    color: var(--fg-strong);
    font-family: "Space Grotesk", "Work Sans", -apple-system, sans-serif;
    text-shadow: 0 2px 24px rgba(0,0,0,.35);
  }
  .total .delta {
    margin-top: 12px;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--fg-mute);
    font-variant-numeric: tabular-nums;
    font-family: "Space Grotesk", "Work Sans", -apple-system, sans-serif;
  }
  .total .delta.up   { color: var(--up); }
  .total .delta.down { color: var(--down); }

  .foot {
    position: fixed;
    left: 64px;
    bottom: 36px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--foot);
    z-index: 2;
    pointer-events: none;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  }

  /* Coin marquee ticker at bottom */
  .coin-marquee {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 76px;
    overflow: hidden;
    padding: 14px 0;
    mask-image: linear-gradient(to right, transparent, #000 6%, #000 94%, transparent);
    -webkit-mask-image: linear-gradient(to right, transparent, #000 6%, #000 94%, transparent);
    z-index: 2;
    pointer-events: none;
  }
  .coin-track {
    display: flex;
    align-items: center;
    width: max-content;
    will-change: transform;
  }
  .coin-half {
    display: flex;
    align-items: center;
  }
  .coin-chip {
    display: flex;
    align-items: center;
    gap: 12px;
    font-variant-numeric: tabular-nums;
    font-size: 16px;
    white-space: nowrap;
    padding: 10px 20px;
    margin-right: 1.25rem;
    border: 1px solid var(--hair);
    border-radius: 999px;
    background: rgba(12, 14, 18, 0.55);
    backdrop-filter: blur(20px) saturate(1.2);
    -webkit-backdrop-filter: blur(20px) saturate(1.2);
    box-shadow: 0 6px 24px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.06);
    transition: border-color .2s, background .2s;
  }
  .coin-chip .logo {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    object-fit: cover;
  }
  .coin-chip .icon {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 1.5px solid var(--fg-strong);
    display: grid;
    place-items: center;
    font-size: 11px;
    font-weight: 700;
    color: var(--fg-strong);
    background: rgba(255,255,255,0.06);
  }
  .coin-chip .sym {
    font-weight: 700;
    color: var(--fg-strong);
    letter-spacing: 0.02em;
  }
  .coin-chip .amt {
    color: var(--fg-dim);
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.01em;
  }
  .coin-chip .chg {
    font-size: 13px;
    font-weight: 600;
    margin-left: 2px;
  }
  .coin-chip .chg.up   { color: var(--up); }
  .coin-chip .chg.down { color: var(--down); }

  /* The minimal style is the only one that shows the panel, ticker and foot.
     Every other content style hides all of them. */
  body:not(.is-minimal) .panel,
  body:not(.is-minimal) .foot,
  body:not(.is-minimal) .coin-marquee {
    display: none !important;
  }
</style>
</head>
<body>
<div id="bg-layer"></div>
<div id="content"></div>
<div id="focus"></div>
<div id="ledger"></div>
<div id="scale"></div>

<div class="panel" id="panel">
  <div class="total">
    <div class="value" id="total">—</div>
    <div class="delta" id="delta">—</div>
  </div>
</div>
<div class="foot" id="foot">momo · demo</div>

<div class="coin-marquee" id="coin-marquee">
  <div class="coin-track" id="coin-track"></div>
</div>

<script src="chrome-arcs.js"></script>
<script src="anodized-ink.js"></script>
<script src="laser-flow.js"></script>
<script src="plasma-wave.js"></script>
<script src="finance-bento.js"></script>
<script src="elegant-contents.js"></script>
<script>
// Momo — live wallpaper.
// Host API:  window.Momo.update({ portfolio, coins, at, currency })
//            window.Momo.setTheme(themeString)

const MAX_ROWS = 10;
const elTotal = document.getElementById('total');
const elDelta = document.getElementById('delta');
const elFoot  = document.getElementById('foot');

// Animated total counter: ticks from the previous value to the new one.
let totalAnimRaf = 0;
let totalAnimCurrent = null;
const TOTAL_DUR = 700;
function animateTotal(target, cur) {
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    totalAnimCurrent = target;
    elTotal.textContent = money(target, cur);
    return;
  }
  const from = (totalAnimCurrent != null) ? totalAnimCurrent : target;
  if (Math.abs(from - target) < 0.005) {
    totalAnimCurrent = target;
    elTotal.textContent = money(target, cur);
    return;
  }
  if (totalAnimRaf) cancelAnimationFrame(totalAnimRaf);
  const start0 = performance.now();
  function frame(ts) {
    const elapsed = ts - start0;
    const progress = Math.min(elapsed / TOTAL_DUR, 1);
    const eased = 1 - Math.pow(1 - progress, 3);
    const val = from + (target - from) * eased;
    totalAnimCurrent = val;
    elTotal.textContent = money(val, cur);
    if (progress < 1) {
      totalAnimRaf = requestAnimationFrame(frame);
    } else {
      totalAnimCurrent = target;
      elTotal.textContent = money(target, cur);
      totalAnimRaf = 0;
    }
  }
  totalAnimRaf = requestAnimationFrame(frame);
}

const CUR_SYM = { USD: '$', EUR: '€', INR: '₹', GBP: '£', JPY: '¥' };

function money(v, cur) {
  const sym = CUR_SYM[cur] || '';
  if (v >= 1e6) return sym + (v / 1e6).toFixed(2) + 'M';
  if (v >= 1e4) return sym + Math.round(v).toLocaleString('en-US');
  if (v >= 1)    return sym + v.toFixed(2);
  return sym + v.toPrecision(3);
}

function price(v, cur) {
  const sym = CUR_SYM[cur] || '';
  if (v >= 1000) return sym + v.toLocaleString('en-US', { maximumFractionDigits: 0 });
  if (v >= 1)    return sym + v.toFixed(2);
  if (v >= 0.01) return sym + v.toFixed(4);
  return sym + v.toPrecision(4);
}

function pct(v) {
  const n = v * 100;
  return (n >= 0 ? '+' : '') + n.toFixed(2) + '%';
}

function classFor(v) {
  if (Math.abs(v) < 0.0005) return '';
  return v > 0 ? 'up' : 'down';
}

function inkColorFor(change) {
  // Up → green, down → red. Re-tints the Anodized Ink (embers) background
  // so the room colour carries the portfolio mood.
  return change > 0 ? '#0b6e2f' : '#d1001c';
}

const COIN_ICONS = { BTC: 1, ETH: 1027, SOL: 5426, BNB: 1839, XRP: 52, DOGE: 74, ADA: 2010, AVAX: 5805, LINK: 1975, TON: 11419 };

// Demo fallback data
function getDemoData() {
  const base = [
    ['BTC', 91204, 0.0214], ['ETH', 3142.55, 0.0142], ['SOL', 187.9, 0.0531],
    ['BNB', 612.4, -0.0068], ['XRP', 2.134, 0.0121], ['DOGE', 0.3821, -0.0243],
    ['ADA', 0.9182, 0.0087], ['AVAX', 38.62, -0.0155], ['LINK', 22.41, 0.0342],
    ['TON', 5.182, 0.0041],
  ];
  const holdings = [0.12, 1.4, 9.5, 0.8, 320, 2400, 900, 22, 40, 120];
  const coins = base.map(([symbol, px, chg], i) => ({
    symbol,
    price: px,
    change24h: chg,
    amount: holdings[i],
    logo: COIN_ICONS[symbol] ? `https://s2.coinmarketcap.com/static/img/coins/64x64/${COIN_ICONS[symbol]}.png` : ''
  }));
  const value = coins.reduce((s, c, i) => s + c.price * holdings[i], 0);
  const prev = coins.reduce((s, c, i) => s + (c.price / (1 + c.change24h)) * holdings[i], 0);
  return {
    portfolio: { value, change24h: (value - prev) / prev, currency: 'USD' },
    coins,
    at: Date.now(),
  };
}

let last = null;
function getData() {
  return last || getDemoData();
}

// Background management: exactly one WebGL canvas runs at a time
let currentBg = null;
let currentBgHandle = null;
let currentInkHex = '#d1001c';
let customBgConfig = { activeId: '', items: [] };
let lastMouseInside = false;

function activeCustomBg() {
  const id = customBgConfig.activeId;
  return (customBgConfig.items || []).find(b => b.id === id) || (customBgConfig.items || [])[0] || null;
}

function destroyBg() {
  if (currentBgHandle) {
    try {
      if (typeof currentBgHandle === 'function') currentBgHandle();
      else if (currentBgHandle.destroy) currentBgHandle.destroy();
    } catch (e) {
      console.warn('Error destroying bg', e);
    }
    currentBgHandle = null;
  }
  currentBg = null;
  const bgLayer = document.getElementById('bg-layer');
  if (bgLayer) bgLayer.innerHTML = '';
}

function setBackground(bg, force) {
  if (!force && currentBg === bg && currentBgHandle) return;
  destroyBg();
  const bgLayer = document.getElementById('bg-layer');
  if (!bgLayer) return;
  currentBg = bg;

  if (bg === 'aurora' && window.ChromeArcs) {
    currentBgHandle = window.ChromeArcs.mount(bgLayer, { speed: 1, rings: 1, interactive: true });
  } else if (bg === 'embers' && window.AnodizedInk) {
    currentBgHandle = window.AnodizedInk.mount(bgLayer, { preset: 'crimson', colors: { ink: currentInkHex }, interactive: true });
  } else if (bg === 'laser' && window.LaserFlow) {
    currentBgHandle = window.LaserFlow.mount(bgLayer, { mouseInteraction: true });
  } else if (bg === 'plasma' && window.PlasmaWave) {
    currentBgHandle = window.PlasmaWave.mount(bgLayer, { mouseInteraction: true });
  } else if (bg === 'custom') {
    const item = activeCustomBg();
    if (item && item.path) {
      const src = item.path.startsWith('file://') ? item.path : 'file://' + item.path.split('/').map(encodeURIComponent).join('/');
      if (item.type === 'video') {
        const v = document.createElement('video');
        v.className = 'bg-media';
        v.src = src;
        v.autoplay = true;
        v.muted = true;
        v.loop = true;
        v.playsInline = true;
        v.setAttribute('playsinline', '');
        v.setAttribute('muted', '');
        bgLayer.appendChild(v);
        v.play().catch(() => {});
        currentBgHandle = { destroy() { v.pause(); v.removeAttribute('src'); v.load(); v.remove(); } };
      } else {
        const img = document.createElement('img');
        img.className = 'bg-media';
        img.src = src;
        img.alt = '';
        bgLayer.appendChild(img);
        currentBgHandle = { destroy() { img.remove(); } };
      }
    }
  }
}

// Content management
let currentContent = 'panel';
let contentHandle = null;
let elcHandles = {};
const ELC_MAP = { focus: 'Focus', ledger: 'Ledger', scale: 'Scale' };

// Finance Bento data generator
const BENTO_DEMO = {
  payments: [
    { name: "Rent", date: "Nov 1", amount: 1800 },
    { name: "Index fund · auto-buy", date: "Nov 3", amount: 500 },
    { name: "Insurance", date: "Nov 9", amount: 96 }
  ],
  goals: [
    { name: "House deposit", progress: 0.42, target: 60000 },
    { name: "Japan, spring", progress: 0.76, target: 6000 }
  ],
  cashflow: {
    months: ["May", "Jun", "Jul", "Aug", "Sep", "Oct"],
    income: [[2.4, 3.6, 5.4, 6.4, 5.0, 3.4], [2.0, 3.0, 4.4, 5.2, 4.2, 2.8], [1.6, 2.4, 3.4, 4.0, 3.3, 2.2]],
    spending: [[1.2, 2.2, 3.8, 4.6, 3.4, 1.8], [1.0, 1.8, 3.0, 3.8, 2.8, 1.5], [0.8, 1.4, 2.4, 3.0, 2.2, 1.2]]
  },
  crypto: [
    { name: "Bitcoin", symbol: "BTC", share: 0.62, change: "+3.1%", ohlc: [[66.1, 67.0, 65.8, 66.8], [66.8, 67.6, 66.5, 67.4], [67.4, 67.9, 66.9, 67.1], [67.1, 68.2, 67.0, 68.0], [68.0, 68.9, 67.8, 68.7], [68.7, 69.1, 68.1, 68.4], [68.4, 69.6, 68.3, 69.4]] },
    { name: "Ethereum", symbol: "ETH", share: 0.26, change: "−0.8%", ohlc: [[3.52, 3.58, 3.44, 3.47], [3.47, 3.55, 3.4, 3.53], [3.53, 3.56, 3.38, 3.41], [3.41, 3.5, 3.36, 3.48], [3.48, 3.51, 3.39, 3.43], [3.43, 3.49, 3.37, 3.46], [3.46, 3.52, 3.42, 3.44]] },
    { name: "Solana", symbol: "SOL", share: 0.12, change: "+6.4%", ohlc: [[142, 149, 139, 147], [147, 151, 141, 143], [143, 156, 142, 154], [154, 158, 147, 149], [149, 162, 148, 160], [160, 166, 155, 157], [157, 171, 156, 168]] }
  ],
  stocks: { days: ["Mon", "Tue", "Wed", "Thu", "Fri"], values: [2.1, 1.2, 3.4, 1.9, 4.6] }
};

let bentoHistory = null;
function buildBentoHistory(totalNow) {
  const out = [];
  const now = new Date();
  for (let i = 0; i < 36; i++) {
    const t = i / 35;
    const d = new Date(now.getFullYear(), now.getMonth() - (35 - i), 1);
    const noise = (Math.sin(i * 12.9898 + 156.466) * 43758.5453) % 1;
    out.push({
      date: d.toISOString(),
      fiat: 14000 + t * 7000 + Math.sin(i * 0.9) * 900,
      stocks: 12000 + t * 19000 + Math.sin(i * 0.55) * 1600 + noise * 800,
      crypto: Math.max(2500, totalNow * (0.35 + t * 0.65) + Math.sin(i * 0.8 + 1) * totalNow * 0.08 + Math.cos(i * 0.33) * totalNow * 0.04)
    });
  }
  out[35].crypto = totalNow;
  return out;
}

function buildBentoCrypto(coins) {
  const shares = [0.62, 0.26, 0.12];
  const names = { BTC: "Bitcoin", ETH: "Ethereum", SOL: "Solana", BNB: "BNB", XRP: "XRP", DOGE: "Dogecoin", ADA: "Cardano", AVAX: "Avalanche", LINK: "Chainlink", TON: "Toncoin" };
  return (coins || []).slice(0, 3).map((c, i) => {
    const px = c.price;
    const ohlc = [];
    let p = px * 0.97;
    for (let k = 0; k < 7; k++) {
      const o = p;
      const cl = o + px * 0.004 * Math.sin(k * 1.3 + i);
      const hi = Math.max(o, cl) * 1.004;
      const lo = Math.min(o, cl) * 0.996;
      ohlc.push([o, hi, lo, cl]);
      p = cl;
    }
    const chg = c.change24h * 100;
    return {
      name: names[c.symbol] || c.symbol,
      symbol: c.symbol,
      share: shares[i] || 0,
      change: (chg >= 0 ? "+" : "−") + Math.abs(chg).toFixed(1) + "%",
      ohlc
    };
  });
}

function buildBentoData(snap) {
  const totalNow = snap ? snap.portfolio.value : 22400;
  if (!bentoHistory) bentoHistory = buildBentoHistory(totalNow);
  else bentoHistory[35].crypto = totalNow;
  return {
    history: bentoHistory,
    netWorth: snap ? snap.portfolio.value : 22400,
    payments: BENTO_DEMO.payments,
    goals: BENTO_DEMO.goals,
    cashflow: BENTO_DEMO.cashflow,
    crypto: snap ? buildBentoCrypto(snap.coins) : BENTO_DEMO.crypto,
    stocks: BENTO_DEMO.stocks,
    holdings: snap ? snap.coins : []
  };
}

function bentoSubtitle(snap) {
  if (!snap || !snap.at) return "Demo data";
  const t = new Date(snap.at);
  return "Updated today, " + t.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", hour12: false });
}

function setContent(content, bg) {
  currentContent = content;
  const isPanel = content === 'panel';
  const isDashboard = content === 'dashboard';
  const isElc = content === 'focus' || content === 'ledger' || content === 'scale';

  document.body.classList.toggle('is-minimal', isPanel);
  document.body.classList.toggle('show-content', isDashboard);
  document.body.classList.toggle('show-elc', isElc);

  const contentEl = document.getElementById('content');
  if (isDashboard) {
    if (contentEl) {
      contentEl.classList.add('on');
      if (bg !== 'none') contentEl.classList.add('clear');
      else contentEl.classList.remove('clear');

      if (!contentHandle && window.FinanceBento) {
        contentHandle = window.FinanceBento.mount(contentEl, buildBentoData(getData()), {
          title: 'Overview',
          subtitle: bentoSubtitle(getData())
        });
      } else if (contentHandle) {
        contentHandle.update(buildBentoData(getData()), { subtitle: bentoSubtitle(getData()) });
      }
    }
  } else {
    if (contentEl) {
      contentEl.classList.remove('on');
      contentEl.classList.remove('clear');
      if (contentHandle) {
        try { contentHandle.destroy(); } catch (e) {}
        contentHandle = null;
      }
      contentEl.innerHTML = '';
    }
  }

  ['focus', 'ledger', 'scale'].forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    if (content === id) {
      el.classList.add('on');
      if (!elcHandles[id] && window.ElegantContents && window.ElegantContents[ELC_MAP[id]]) {
        elcHandles[id] = window.ElegantContents[ELC_MAP[id]].mount(el, getData());
      } else if (elcHandles[id]) {
        elcHandles[id].update(getData());
      }
    } else {
      el.classList.remove('on');
    }
  });

  if (isPanel) {
    render();
  }
}

function render() {
  const data = getData();
  if (!data) return;
  const cur = data.portfolio.currency || 'USD';
  const p = data.portfolio;

  // Re-tint ink to market sentiment if embers is active
  currentInkHex = inkColorFor(p.change24h);
  if (currentBg === 'embers' && currentBgHandle && currentBgHandle.update) {
    currentBgHandle.update({ colors: { ink: currentInkHex } });
  }

  // Update active content
  if (currentContent === 'dashboard' && contentHandle) {
    contentHandle.update(buildBentoData(data), { subtitle: bentoSubtitle(data) });
  } else if (elcHandles[currentContent]) {
    elcHandles[currentContent].update(data);
  }

  if (currentContent === 'panel') {
    animateTotal(p.value, cur);
    elDelta.textContent = pct(p.change24h) + ' today';
    elDelta.className = 'delta ' + classFor(p.change24h);

    const coins = (data.coins || []).slice(0, MAX_ROWS);
    const chips = coins.map(c => {
      const logoHtml = c.logo
        ? `<img class="logo" src="${c.logo}" alt="${c.symbol}" onerror="this.style.display='none'; this.nextElementSibling.style.display='grid';"><span class="icon" style="display:none">${c.symbol.slice(0, 3)}</span>`
        : `<span class="icon">${c.symbol.slice(0, 3)}</span>`;
      const amt = (c.amount != null) ? c.amount : 0;
      const val = c.price * amt;
      const amtStr = amt >= 1 ? amt.toLocaleString('en-US', { maximumFractionDigits: 4 }) : amt.toPrecision(4);
      return `
        <div class="coin-chip">
          ${logoHtml}
          <span class="sym">${c.symbol}</span>
          <span class="amt">${amtStr} · ${money(val, cur)}</span>
          <span class="chg ${classFor(c.change24h)}">${pct(c.change24h)}</span>
        </div>`;
    }).join('');

    const track = document.getElementById('coin-track');
    if (track && chips) {
      const half = '<div class="coin-half">' + chips.repeat(2) + '</div>';
      track.innerHTML = half + half;
    }

    const t = data.at ? new Date(data.at) : null;
    elFoot.textContent = t
      ? 'momo · ' + t.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false })
      : 'momo';
  }
}

window.Momo = {
  update(snap) {
    last = snap;
    render();
  },

  setMouse(m) {
    const bgLayer = document.getElementById('bg-layer');
    if (!bgLayer || !m) return;
    const inside = !!m.inside;
    const x = Number(m.x) || 0;
    const y = Number(m.y) || 0;
    const common = { bubbles: true, cancelable: false, clientX: x, clientY: y, pointerId: 1, isPrimary: true };
    if (inside) {
      lastMouseInside = true;
      bgLayer.dispatchEvent(new PointerEvent('pointermove', common));
    } else if (lastMouseInside) {
      lastMouseInside = false;
      bgLayer.dispatchEvent(new PointerEvent('pointerleave', common));
    }
  },

  setCustomBg(cfg) {
    customBgConfig = cfg || { activeId: '', items: [] };
    if (currentBg === 'custom') setBackground('custom', true);
  },

  setTheme(name) {
    document.documentElement.dataset.theme = name || 'aurora-panel';
    let bg = 'aurora', content = 'panel';
    if (name === 'rain') {
      bg = 'aurora';
      content = 'dashboard';
    } else {
      const parts = String(name || '').split('-');
      const validBgs = ['aurora', 'embers', 'laser', 'plasma', 'custom'];
      const validContents = ['panel', 'dashboard', 'focus', 'ledger', 'scale'];
      if (validBgs.includes(parts[0])) bg = parts[0];
      else if (['midnight', 'slate', 'paper', 'ember'].includes(parts[0])) bg = 'none';
      if (validContents.includes(parts[1])) content = parts[1];
    }
    setBackground(bg, currentBg === bg && bg === 'custom');
    setContent(content, bg);
  },

  demo() {
    const base = [
      ['BTC', 91204, 0.0214], ['ETH', 3142.55, 0.0142], ['SOL', 187.9, 0.0531],
      ['BNB', 612.4, -0.0068], ['XRP', 2.134, 0.0121], ['DOGE', 0.3821, -0.0243],
      ['ADA', 0.9182, 0.0087], ['AVAX', 38.62, -0.0155], ['LINK', 22.41, 0.0342],
      ['TON', 5.182, 0.0041],
    ];
    const holdings = [0.12, 1.4, 9.5, 0.8, 320, 2400, 900, 22, 40, 120];

    const build = (drift) => {
      const coins = base.map(([symbol, px, chg], i) => ({
        symbol,
        price: px * (1 + drift * (0.4 + i * 0.12)),
        change24h: chg + drift * (0.5 + i * 0.1),
        amount: holdings[i],
        logo: COIN_ICONS[symbol] ? `https://s2.coinmarketcap.com/static/img/coins/64x64/${COIN_ICONS[symbol]}.png` : ''
      }));
      const value = coins.reduce((s, c, i) => s + c.price * holdings[i], 0);
      const prev = coins.reduce((s, c, i) => s + (c.price / (1 + c.change24h)) * holdings[i], 0);
      return {
        portfolio: { value, change24h: (value - prev) / prev, currency: 'USD' },
        coins,
        at: Date.now(),
      };
    };

    let drift = 0;
    this.update(build(drift));
    setInterval(() => {
      drift += (Math.random() - 0.5) * 0.01;
      drift = Math.max(-0.08, Math.min(0.08, drift));
      this.update(build(drift));
    }, 4000);
  }
};

// Continuous marquee animation loop - only active when in panel content mode
let marqueeX = 0, marqueePrev = 0;
function marqueeTick(t) {
  if (currentContent === 'panel') {
    const track = document.getElementById('coin-track');
    if (track) {
      if (!marqueePrev) marqueePrev = t;
      const dt = Math.min(t - marqueePrev, 100);
      marqueePrev = t;
      const half = track.scrollWidth / 2;
      if (half > 0) {
        marqueeX += (dt / 1000) * 80;
        if (marqueeX >= half) marqueeX -= half;
        track.style.transform = 'translate3d(' + (-marqueeX).toFixed(2) + 'px,0,0)';
      }
    }
  } else {
    marqueePrev = 0;
  }
  requestAnimationFrame(marqueeTick);
}
requestAnimationFrame(marqueeTick);

// Initial boot
if (window.__MOMO_CUSTOM_BG) window.Momo.setCustomBg(window.__MOMO_CUSTOM_BG);
window.Momo.setTheme(window.__MOMO_THEME || 'aurora-panel');
render();
if (!window.__MOMO_HOST) setTimeout(() => window.Momo.demo(), 200);
</script>
