<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Momo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }

  /* Themes. Pick one in Settings > Themes; the host sets data-theme before
     the first paint, so there is no flash of the wrong world. */
  :root {
    --bg: #0d0f11;
    --fg: #ffffff;
    --fg-strong: rgba(255,255,255,.92);
    --fg-dim: rgba(255,255,255,.38);
    --fg-mute: rgba(255,255,255,.42);
    --hair: rgba(255,255,255,.08);
    --hair-soft: rgba(255,255,255,.045);
    --foot: rgba(255,255,255,.2);
    --up: #6fd39a;
    --down: #e8735f;
  }
  :root[data-theme="slate"] {
    --bg: #12171c;
    --fg: #eaf0f5;
    --fg-strong: #f4f8fb;
    --fg-dim: rgba(234,240,245,.42);
    --fg-mute: rgba(234,240,245,.5);
    --hair: rgba(234,240,245,.1);
    --hair-soft: rgba(234,240,245,.06);
    --foot: rgba(234,240,245,.26);
    --up: #5fd3a6;
    --down: #ff8f7a;
  }
  :root[data-theme="paper"] {
    --bg: #f4f1ea;
    --fg: #1c1b18;
    --fg-strong: #14130f;
    --fg-dim: rgba(28,27,24,.46);
    --fg-mute: rgba(28,27,24,.52);
    --hair: rgba(0,0,0,.12);
    --hair-soft: rgba(0,0,0,.07);
    --foot: rgba(28,27,24,.34);
    --up: #1f7a4d;
    --down: #b0432f;
  }
  :root[data-theme="ember"] {
    --bg: #140d0a;
    --fg: #ffe9dc;
    --fg-strong: #ffd9c4;
    --fg-dim: rgba(255,233,220,.44);
    --fg-mute: rgba(255,233,220,.52);
    --hair: rgba(255,233,220,.12);
    --hair-soft: rgba(255,233,220,.06);
    --foot: rgba(255,233,220,.28);
    --up: #f5b23c;
    --down: #ff7a5c;
  }

  body {
    background: var(--bg);
    font: 400 13px/1 -apple-system, "SF Pro Text", system-ui, sans-serif;
    color: var(--fg);
    -webkit-font-smoothing: antialiased;
  }

  .panel {
    position: fixed;
    left: 64px;
    top: 50%;
    transform: translateY(-50%);
    width: 340px;
    z-index: 1;
  }

  /* Chrome Arcs background for the first theme (aurora). Hidden otherwise. */
  #arcs { position: fixed; inset: 0; z-index: 0; display: none; }
  #arcs.on { display: block; }
  /* Anodized Ink background for the second theme (embers). Hidden otherwise. */
  #ink { position: fixed; inset: 0; z-index: 0; display: none; }
  #ink.on { display: block; }
  /* Holo Mosaic background for the third theme (holo). Hidden otherwise. */
  #holo { position: fixed; inset: 0; z-index: 0; display: none; }
  #holo.on { display: block; }
  /* Laser Flow background for the fourth theme (laser). Hidden otherwise. */
  #laser { position: fixed; inset: 0; z-index: 0; display: none; }
  #laser.on { display: block; }
  /* Plasma Wave background for the fifth theme (plasma). Hidden otherwise. */
  #plasma { position: fixed; inset: 0; z-index: 0; display: none; }
  #plasma.on { display: block; }
  /* Module content (the dashboard) for every content style except the
     minimal panel. Replaces the panel. With a background active it goes
     clear, so the bg shows through the gaps. */
  #content { position: fixed; inset: 0; z-index: 0; display: none; overflow: auto; background: #000; padding: 24px; }
  #content.on { display: block; }
  #content.clear { background: transparent; }
  #content.clear .fpb .fpb-c { background: transparent; }
  body.show-content .panel { display: none; }
  /* Elegant contents: Focus, Ledger, Scale. Transparent like the clear
     dashboard, so the background shows through. */
  #focus, #ledger, #scale { position: fixed; inset: 0; z-index: 0; display: none; }
  #focus.on, #ledger.on, #scale.on { display: block; }
  body.show-elc .panel { display: none; }

  /* total */
  .total { margin-bottom: 28px; }
  .total .value {
    font-size: 30px;
    font-weight: 300;
    letter-spacing: -0.015em;
    font-variant-numeric: tabular-nums;
  }
  .total .delta {
    margin-top: 7px;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.02em;
    color: var(--fg-mute);
    font-variant-numeric: tabular-nums;
  }
  .total .delta.up   { color: var(--up); }
  .total .delta.down { color: var(--down); }

  .rule {
    height: 1px;
    background: var(--hair);
    margin-bottom: 6px;
  }

  /* ten tokens */
  .list { display: flex; flex-direction: column; }
  .panel .row {
    display: grid;
    grid-template-columns: 64px 1fr auto;
    align-items: baseline;
    padding: 11px 0;
    border-bottom: 1px solid var(--hair-soft);
    font-variant-numeric: tabular-nums;
  }
  .panel .row:last-child { border-bottom: none; }

  .sym {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.06em;
    color: var(--fg-strong);
  }
  .price {
    font-size: 12px;
    color: var(--fg-dim);
    letter-spacing: 0.01em;
  }
  .chg {
    font-size: 12px;
    font-weight: 500;
    text-align: right;
    min-width: 62px;
    color: var(--fg-mute);
  }
  .chg.up   { color: var(--up); }
  .chg.down { color: var(--down); }

  .foot {
    margin-top: 22px;
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--foot);
  }
</style>
</head>
<body>
<div id="arcs"></div>
<div id="ink"></div>
<div id="holo"></div>
<div id="laser"></div>
<div id="plasma"></div>
<div id="content"></div>
<div id="focus"></div>
<div id="ledger"></div>
<div id="scale"></div>
<div class="panel">
  <div class="total">
    <div class="value" id="total">—</div>
    <div class="delta" id="delta">—</div>
  </div>
  <div class="rule"></div>
  <div class="list" id="list"></div>
  <div class="foot" id="foot">momo · demo</div>
</div>

<script src="chrome-arcs.js"></script>
<script src="anodized-ink.js"></script>
<script src="holo-mosaic.js"></script>
<script src="laser-flow.js"></script>
<script src="plasma-wave.js"></script>
<script src="finance-bento.js"></script>
<script src="elegant-contents.js"></script>
<script>
// Momo — main theme.
// One portfolio total, ten holdings. Nothing else on the desktop.
//
// Host API:  window.Momo.update({ portfolio, coins, at, currency })
//            portfolio = { value, change24h, currency }
//            coins     = [{ symbol, price, change24h }]   (max 10)

const MAX_ROWS = 10;
const elTotal = document.getElementById('total');
const elDelta = document.getElementById('delta');
const elList  = document.getElementById('list');
const elFoot  = document.getElementById('foot');

const CUR_SYM = { USD: '$', EUR: '€', INR: '₹', GBP: '£', JPY: '¥' };

function money(v, cur) {
  const sym = CUR_SYM[cur] || '';
  if (v >= 1e6) return sym + (v / 1e6).toFixed(2) + 'M';
  if (v >= 1e4) return sym + Math.round(v).toLocaleString('en-US');
  if (v >= 1)    return sym + v.toFixed(2);
  return sym + v.toPrecision(3);
}

function price(v, cur) {
  const sym = CUR_SYM[cur] || '';
  if (v >= 1000) return sym + v.toLocaleString('en-US', { maximumFractionDigits: 0 });
  if (v >= 1)    return sym + v.toFixed(2);
  if (v >= 0.01) return sym + v.toFixed(4);
  return sym + v.toPrecision(4);
}

function pct(v) {
  const n = v * 100;
  return (n >= 0 ? '+' : '') + n.toFixed(2) + '%';
}

function classFor(v) {
  if (Math.abs(v) < 0.0005) return '';
  return v > 0 ? 'up' : 'down';
}

let last = null;
let arcsMounted = false;
let inkHandle = null;
let currentInkHex = '#d1001c'; // crimson until the first snapshot arrives
let holoHandle = null;
let laserHandle = null;
let plasmaHandle = null;
let bentoHistory = null;
let contentHandle = null;
let contentId = null;
let elcHandles = {}; // focus | ledger | scale -> { update, destroy }
let currentContent = 'panel';

function elcData(snap) {
  return snap || null;
}

// The ink reads the market: strong growth dark green, little up light green,
// little down light red, bigger drop cherry red. Boundaries are ±2% a day.
function inkColorFor(change) {
  if (change >= 0.02) return '#0b6e2f';
  if (change >= 0)    return '#4ade80';
  if (change >= -0.02) return '#f87171';
  return '#d1001c';
}

// ---- Finance Bento data ----
// The crypto rows are live (real prices and 24h changes from the snapshot).
// History, payments, goals, cash flow and stocks are demo shapes — the
// snapshot has no 36 months of balances, no bank data and no stocks —
// until a real source exists for them. The history's last point is always
// the real portfolio total.
const BENTO_DEMO = {
  payments: [
    { name: "Rent", date: "Nov 1", amount: 1800 },
    { name: "Index fund · auto-buy", date: "Nov 3", amount: 500 },
    { name: "Insurance", date: "Nov 9", amount: 96 }
  ],
  goals: [
    { name: "House deposit", progress: 0.42, target: 60000 },
    { name: "Japan, spring", progress: 0.76, target: 6000 }
  ],
  cashflow: {
    months: ["May", "Jun", "Jul", "Aug", "Sep", "Oct"],
    income: [[2.4, 3.6, 5.4, 6.4, 5.0, 3.4], [2.0, 3.0, 4.4, 5.2, 4.2, 2.8], [1.6, 2.4, 3.4, 4.0, 3.3, 2.2]],
    spending: [[1.2, 2.2, 3.8, 4.6, 3.4, 1.8], [1.0, 1.8, 3.0, 3.8, 2.8, 1.5], [0.8, 1.4, 2.4, 3.0, 2.2, 1.2]]
  },
  crypto: [
    { name: "Bitcoin", symbol: "BTC", share: 0.62, change: "+3.1%", ohlc: [[66.1, 67.0, 65.8, 66.8], [66.8, 67.6, 66.5, 67.4], [67.4, 67.9, 66.9, 67.1], [67.1, 68.2, 67.0, 68.0], [68.0, 68.9, 67.8, 68.7], [68.7, 69.1, 68.1, 68.4], [68.4, 69.6, 68.3, 69.4]] },
    { name: "Ethereum", symbol: "ETH", share: 0.26, change: "−0.8%", ohlc: [[3.52, 3.58, 3.44, 3.47], [3.47, 3.55, 3.4, 3.53], [3.53, 3.56, 3.38, 3.41], [3.41, 3.5, 3.36, 3.48], [3.48, 3.51, 3.39, 3.43], [3.43, 3.49, 3.37, 3.46], [3.46, 3.52, 3.42, 3.44]] },
    { name: "Solana", symbol: "SOL", share: 0.12, change: "+6.4%", ohlc: [[142, 149, 139, 147], [147, 151, 141, 143], [143, 156, 142, 154], [154, 158, 147, 149], [149, 162, 148, 160], [160, 166, 155, 157], [157, 171, 156, 168]] }
  ],
  stocks: { days: ["Mon", "Tue", "Wed", "Thu", "Fri"], values: [2.1, 1.2, 3.4, 1.9, 4.6] }
};

function buildBentoHistory(totalNow) {
  // 36 month-end balances. Crypto grows into the real total; fiat/stocks are
  // demo trajectories. Seeded wobble so the shape is stable across polls.
  const out = [];
  const now = new Date();
  for (let i = 0; i < 36; i++) {
    const t = i / 35;
    const d = new Date(now.getFullYear(), now.getMonth() - (35 - i), 1);
    const noise = (Math.sin(i * 12.9898 + 156.466) * 43758.5453) % 1;
    out.push({
      date: d.toISOString(),
      fiat: 14000 + t * 7000 + Math.sin(i * 0.9) * 900,
      stocks: 12000 + t * 19000 + Math.sin(i * 0.55) * 1600 + noise * 800,
      crypto: Math.max(2500, totalNow * (0.35 + t * 0.65) + Math.sin(i * 0.8 + 1) * totalNow * 0.08 + Math.cos(i * 0.33) * totalNow * 0.04)
    });
  }
  out[35].crypto = totalNow;
  return out;
}

function buildBentoCrypto(coins) {
  const shares = [0.62, 0.26, 0.12];
  const names = { BTC: "Bitcoin", ETH: "Ethereum", SOL: "Solana", BNB: "BNB", XRP: "XRP", DOGE: "Dogecoin", ADA: "Cardano", AVAX: "Avalanche", LINK: "Chainlink", TON: "Toncoin" };
  return (coins || []).slice(0, 3).map((c, i) => {
    const px = c.price;
    const ohlc = [];
    let p = px * 0.97;
    for (let k = 0; k < 7; k++) {
      const o = p;
      const cl = o + px * 0.004 * Math.sin(k * 1.3 + i);
      const hi = Math.max(o, cl) * 1.004;
      const lo = Math.min(o, cl) * 0.996;
      ohlc.push([o, hi, lo, cl]);
      p = cl;
    }
    const chg = c.change24h * 100;
    return {
      name: names[c.symbol] || c.symbol,
      symbol: c.symbol,
      share: shares[i] || 0,
      change: (chg >= 0 ? "+" : "−") + Math.abs(chg).toFixed(1) + "%",
      ohlc
    };
  });
}

function buildBentoData(snap) {
  const totalNow = snap ? snap.portfolio.value : 22400;
  if (!bentoHistory) bentoHistory = buildBentoHistory(totalNow);
  else bentoHistory[35].crypto = totalNow; // keep the last point real
  return {
    history: bentoHistory,
    payments: BENTO_DEMO.payments,
    goals: BENTO_DEMO.goals,
    cashflow: BENTO_DEMO.cashflow,
    crypto: snap ? buildBentoCrypto(snap.coins) : BENTO_DEMO.crypto,
    stocks: BENTO_DEMO.stocks
  };
}

function bentoSubtitle(snap) {
  if (!snap || !snap.at) return "Demo data";
  const t = new Date(snap.at);
  return "Updated today, " + t.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", hour12: false });
}

function render() {
  if (!last) return;
  const cur = last.portfolio.currency || 'USD';
  const p = last.portfolio;

  // Re-tint the ink to the market on every snapshot.
  currentInkHex = inkColorFor(p.change24h);
  if (inkHandle) inkHandle.update({ colors: { ink: currentInkHex } });
  // Keep the module content live too.
  if (contentHandle) {
    if (contentId === 'dashboard') contentHandle.update(buildBentoData(last), { subtitle: bentoSubtitle(last) });
    else contentHandle.update(last);
  }
  // And the elegant content, whichever one is showing.
  if (elcHandles[currentContent]) elcHandles[currentContent].update(elcData(last));

  elTotal.textContent = money(p.value, cur);
  elDelta.textContent = pct(p.change24h) + ' today';
  elDelta.className = 'delta ' + classFor(p.change24h);

  const coins = (last.coins || []).slice(0, MAX_ROWS);
  elList.innerHTML = coins.map(c => `
    <div class="row">
      <span class="sym">${c.symbol}</span>
      <span class="price">${price(c.price, cur)}</span>
      <span class="chg ${classFor(c.change24h)}">${pct(c.change24h)}</span>
    </div>`).join('');

  const t = last.at ? new Date(last.at) : null;
  elFoot.textContent = t
    ? 'momo · ' + t.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false })
    : 'momo';
}

// Mounts one module content style into #content, destroying the previous
// one. The dashboard takes the bento data adapter; the other three take the
// raw snapshot. 'panel' is not a module — it is the .panel element.
function mountContent(id) {
  if (contentId === id && contentHandle) return;
  if (contentHandle) { contentHandle.destroy(); contentHandle = null; }
  contentId = id;
  var el = document.getElementById('content');
  if (!el) return;
  el.innerHTML = '';
  if (id === 'dashboard' && window.FinanceBento) {
    contentHandle = window.FinanceBento.mount(el, buildBentoData(last), {
      title: 'Overview',
      subtitle: bentoSubtitle(last)
    });
  } else if (id === 'hero' && window.Spotlight) {
    contentHandle = window.Spotlight.mount(el, last);
  } else if (id === 'tiles' && window.CoinGrid) {
    contentHandle = window.CoinGrid.mount(el, last);
  } else if (id === 'chart' && window.PulseChart) {
    contentHandle = window.PulseChart.mount(el, last);
  }
}

window.Momo = {
  update(snap) { last = snap; render(); },

  // Theme is a data attribute on <html>; every colour above is a variable.
  // The theme is one string, "background-content" (e.g. "aurora-panel"):
  // the background is Chrome Arcs (aurora), Anodized Ink (embers), Holo
  // Mosaic (holo), Laser Flow (laser) or Plasma Wave (plasma), and the
  // content is the minimal panel, the Finance Bento dashboard, or one of
  // the three elegant contents: Focus, Ledger or Scale. Legacy values
  // still work: "aurora"/"embers" mean that bg + panel, "rain" means
  // arcs + dashboard, anything else is the flat panel.
  setTheme(name) {
    document.documentElement.dataset.theme = name || 'midnight';
    var bg = 'none', content = 'panel';
    if (name === 'rain') { bg = 'aurora'; content = 'dashboard'; }
    else {
      var parts = String(name || '').split('-');
      if (parts[0] === 'aurora' || parts[0] === 'embers' || parts[0] === 'holo' || parts[0] === 'laser' || parts[0] === 'plasma') bg = parts[0];
      if (parts[1] === 'dashboard' || parts[1] === 'focus' || parts[1] === 'ledger' || parts[1] === 'scale') content = parts[1];
    }
    currentContent = content;
    var arcs = document.getElementById('arcs');
    if (arcs) {
      if (bg === 'aurora') {
        arcs.classList.add('on');
        if (!arcsMounted && window.ChromeArcs) {
          window.ChromeArcs.mount(arcs, { speed: 1, rings: 1, interactive: false });
          arcsMounted = true;
        }
      } else {
        arcs.classList.remove('on');
      }
    }
    var ink = document.getElementById('ink');
    if (ink) {
      if (bg === 'embers') {
        ink.classList.add('on');
        if (!inkHandle && window.AnodizedInk) {
          inkHandle = window.AnodizedInk.mount(ink, { preset: 'crimson', colors: { ink: currentInkHex }, interactive: false });
        }
      } else {
        ink.classList.remove('on');
      }
    }
    var holo = document.getElementById('holo');
    if (holo) {
      if (bg === 'holo') {
        holo.classList.add('on');
        if (!holoHandle && window.HoloMosaic) {
          holoHandle = window.HoloMosaic.mount(holo, { mouseInteraction: false });
        }
      } else {
        holo.classList.remove('on');
      }
    }
    var laser = document.getElementById('laser');
    if (laser) {
      if (bg === 'laser') {
        laser.classList.add('on');
        if (!laserHandle && window.LaserFlow) {
          laserHandle = window.LaserFlow.mount(laser, { mouseInteraction: false });
        }
      } else {
        laser.classList.remove('on');
      }
    }
    var plasma = document.getElementById('plasma');
    if (plasma) {
      if (bg === 'plasma') {
        plasma.classList.add('on');
        if (!plasmaHandle && window.PlasmaWave) {
          plasmaHandle = window.PlasmaWave.mount(plasma, { mouseInteraction: false });
        }
      } else {
        plasma.classList.remove('on');
      }
    }
    var contentEl = document.getElementById('content');
    var isElc = content === 'focus' || content === 'ledger' || content === 'scale';
    if (isElc) {
      // Elegant contents live in their own layers, not #content.
      if (contentHandle) { contentHandle.destroy(); contentHandle = null; contentId = null; }
      if (contentEl) contentEl.classList.remove('on');
      document.body.classList.remove('show-content');
      var elcIds = ['focus', 'ledger', 'scale'];
      var elcMap = { focus: 'Focus', ledger: 'Ledger', scale: 'Scale' };
      elcIds.forEach(function (id) {
        var el = document.getElementById(id);
        if (!el) return;
        if (content === id) {
          document.body.classList.add('show-elc');
          el.classList.add('on');
          if (!elcHandles[id] && window.ElegantContents && window.ElegantContents[elcMap[id]]) {
            elcHandles[id] = window.ElegantContents[elcMap[id]].mount(el, elcData(last));
          } else if (elcHandles[id]) {
            elcHandles[id].update(elcData(last));
          }
        } else {
          el.classList.remove('on');
        }
      });
    } else {
      document.body.classList.remove('show-elc');
      ['focus', 'ledger', 'scale'].forEach(function (id) {
        var el = document.getElementById(id);
        if (el) el.classList.remove('on');
      });
      if (contentEl) {
        if (content === 'panel') {
          document.body.classList.remove('show-content');
          contentEl.classList.remove('on');
          if (contentHandle) { contentHandle.destroy(); contentHandle = null; contentId = null; }
        } else {
          document.body.classList.add('show-content');
          contentEl.classList.add('on');
          // A live bg behind the module content shows through the gaps.
          if (bg !== 'none') contentEl.classList.add('clear');
          else contentEl.classList.remove('clear');
          mountContent(content);
        }
      }
    }
  },

  // Browser preview only. Real data arrives from the Swift host.
  demo() {
    const base = [
      ['BTC',  91204, 0.0214], ['ETH', 3142.55, 0.0142], ['SOL', 187.9, 0.0531],
      ['BNB',  612.4, -0.0068], ['XRP', 2.134, 0.0121], ['DOGE', 0.3821, -0.0243],
      ['ADA',  0.9182, 0.0087], ['AVAX', 38.62, -0.0155], ['LINK', 22.41, 0.0342],
      ['TON',  5.182, 0.0041],
    ];
    const holdings = [0.12, 1.4, 9.5, 0.8, 320, 2400, 900, 22, 40, 120];

    const build = (drift) => {
      const coins = base.map(([symbol, px, chg], i) => ({
        symbol,
        price: px * (1 + drift * (0.4 + i * 0.12)),
        change24h: chg + drift * (0.5 + i * 0.1),
      }));
      const value = coins.reduce((s, c, i) => s + c.price * holdings[i], 0);
      const prev = coins.reduce((s, c, i) => s + (c.price / (1 + c.change24h)) * holdings[i], 0);
      return {
        portfolio: { value, change24h: (value - prev) / prev, currency: 'USD' },
        coins,
        at: Date.now(),
      };
    };

    let drift = 0;
    this.update(build(drift));
    setInterval(() => {
      drift += (Math.random() - 0.5) * 0.01;
      drift = Math.max(-0.08, Math.min(0.08, drift));
      this.update(build(drift));
    }, 4000);
  }
};

render();
window.Momo.setTheme(window.__MOMO_THEME);
if (!window.__MOMO_HOST) setTimeout(() => window.Momo.demo(), 200);
</script>
</body>
</html>
